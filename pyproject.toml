# Tool config only — Swipe isn't packaged.

[tool.ruff]
target-version = "py311"   # the Pi's Python (Raspberry Pi OS bookworm)
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "B",             # bugbear: likely bugs
    "S",             # bandit: security
    "I",             # import order
    "UP",            # modern syntax for the target version
    "SIM", "C4", "RUF",
]
ignore = [
    "S104",    # binding 0.0.0.0 is the point: it's served on the home LAN
    "RUF001",  # ambiguous-unicode-character: the UI strings use ✓ ✕ ’ on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]   # asserts and temp paths are what tests do

[tool.coverage.run]
source = ["app", "parsers"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff.lint.isort]
known-first-party = ["app", "parsers", "helpers"]
